name: Sync Workflow

on:
  workflow_dispatch: # Permite rodar manualmente o workflow

jobs:
  sync-files:
    runs-on: ubuntu-latest

    steps:
      - name: Exibir mensagem de início
        run: echo "Iniciando o processo de sincronização."

      - name: Listar arquivos no repositório
        run: ls -la

      - name: Finalizar workflow
        run: echo "Sincronização concluída com sucesso!"