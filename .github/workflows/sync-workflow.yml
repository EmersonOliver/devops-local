name: Sync Workflows to Repos

on:
  workflow_dispatch:

jobs:
  sync-workflows:
    runs-on: ubuntu-latest

    steps:
    - name: List repositories in the organization
      env:
        GH_TOKEN: ${{ secrets.WRKFLOW_TOKEN }}
      run: |
        curl -H "Authorization: token $GH_TOKEN" \
             -H "Accept: application/vnd.github.v3+json" \
             https://api.github.com/orgs/EmersonOliver/repos \
             | jq -r '.[].name' > repos.txt

    - name: Clone and sync workflows
      env:
        GH_TOKEN: ${{ secrets.WRKFLOW_TOKEN }}
      run: |
        while read repo; do
          git clone https://x-access-token:${GH_TOKEN}@github.com/EmersonOliver/$repo temp-repo
          cd temp-repo
          cp -R ../.github .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github
          git commit -m "Add default workflows"
          git push || echo "Workflows already exist in $repo"
          cd ..
          rm -rf temp-repo
        done < repos.txt
